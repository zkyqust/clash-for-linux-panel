name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and regression checks
        working-directory: ui
        run: |
          node --check src/extension.js
          node --check src/backend.js
          node --check media/app.js
          node --test tests/backend.test.js tests/controller.test.js
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/package.py
      - name: Installer shell syntax
        run: |
          for script in setup.sh install.sh uninstall.sh; do
            bash -n "$script"
          done
