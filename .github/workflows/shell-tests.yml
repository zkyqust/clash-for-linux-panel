name: Shell tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # Upstream process fixtures rename GNU sleep; multicall coreutils changes argv[0] behavior.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fish zsh
          curl -fsSL --retry 3 https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          printf '%s  %s\n' fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4 "$RUNNER_TEMP/yq" | sha256sum --check --status
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
      - name: Check Bash syntax
        run: git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Restore preserved entrypoints for the unchanged upstream baseline tests
        run: |
          cp UPSTREAM_README.md README.md
          cp .github/upstream/install.sh.original install.sh
          cp .github/upstream/uninstall.sh.original uninstall.sh
          cp .github/upstream/gitignore.original .gitignore
      - name: Run regression suite
        run: sudo bash tests/run-all.sh
      - name: Run installation and service tests as a regular user
        run: bash tests/run-all.sh install-update install-legacy-nohup install-service systemd-user no-subscription
